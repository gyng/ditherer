<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditherer packed library smoke</title>
  </head>
  <body>
    <main>
      <p data-testid="status">loading</p>
      <canvas data-testid="output" width="2" height="1"></canvas>
    </main>
    <script type="module">
      import {
        createFilterSession,
        filterList,
      } from "/node_modules/@gyng/ditherer-filters/dist/index.js";
      import { workerRPC } from "/node_modules/@gyng/ditherer-filters/dist/client.js";

      const status = document.querySelector('[data-testid="status"]');
      const input = document.createElement("canvas");
      input.width = 2;
      input.height = 1;
      const inputContext = input.getContext("2d", { willReadFrequently: true });
      inputContext.putImageData(new ImageData(new Uint8ClampedArray([
        255, 0, 0, 255,
        0, 255, 0, 255,
      ]), 2, 1), 0, 0);

      try {
        const session = createFilterSession([
          { id: "grayscale", filter: "Grayscale" },
        ], {
          wasmAcceleration: false,
          webglAcceleration: false,
        });
        const result = await session.process(input);
        const output = document.querySelector('[data-testid="output"]');
        output.getContext("2d").drawImage(result.canvas, 0, 0);
        const pixels = output.getContext("2d").getImageData(0, 0, 2, 1).data;
        const isGray = pixels[0] === pixels[1]
          && pixels[1] === pixels[2]
          && pixels[4] === pixels[5]
          && pixels[5] === pixels[6];

        const workerInput = new Uint8ClampedArray([
          255, 0, 0, 255,
          0, 255, 0, 255,
        ]);
        const workerResult = await workerRPC({
          imageData: workerInput.buffer,
          width: 2,
          height: 1,
          chain: [{
            id: "worker-grayscale",
            filterName: "Grayscale",
            displayName: "Grayscale",
            options: undefined,
          }],
          frameIndex: 0,
          isAnimating: false,
          linearize: false,
          wasmAcceleration: false,
          webglAcceleration: false,
          convertGrayscale: false,
          prevOutputs: {},
          prevInputs: {},
          emaMaps: {},
          degaussFrame: -1_000_000,
        }, [workerInput.buffer]);
        const workerPixels = new Uint8ClampedArray(workerResult.imageData);
        const workerIsGray = workerPixels[0] === workerPixels[1]
          && workerPixels[1] === workerPixels[2]
          && workerPixels[4] === workerPixels[5]
          && workerPixels[5] === workerPixels[6];

        window.__librarySmoke = {
          status: isGray && workerIsGray ? "ok" : "failed",
          catalogSize: filterList.length,
          steps: result.steps.map((step) => step.filterName),
          frameIndex: session.state.frameIndex,
          pixels: Array.from(pixels),
          workerSteps: workerResult.stepTimes.map((step) => step.filterName),
          workerPixels: Array.from(workerPixels),
        };
        session.dispose();
        status.textContent = window.__librarySmoke.status;
      } catch (error) {
        window.__librarySmoke = { status: "failed", error: String(error) };
        status.textContent = "failed";
      }
    </script>
  </body>
</html>
